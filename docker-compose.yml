# Ambiente local: API + PostgreSQL. Não há SNS/SQS local: o barramento roda em memória
# (Messaging__Transport=InMemory), então a Saga completa só pode ser exercitada em homologação.
# As migrations são aplicadas na inicialização (Database__MigrateOnStartup=true).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wrench_billing
      POSTGRES_USER: postgres
      # Credencial APENAS para desenvolvimento local.
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wrench_billing"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Billing: Host=postgres;Port=5432;Database=wrench_billing;Username=postgres;Password=postgres
      Database__MigrateOnStartup: "true"
      Messaging__Transport: InMemory
      # Segredos APENAS para desenvolvimento local. Em produção vêm de Secret do Kubernetes.
      Pagamento__WebhookSecret: segredo-webhook-somente-dev
      JwtOptions__Secret: segredo-somente-para-desenvolvimento-local-32+
      Simulacao__Habilitada: "true"
      Simulacao__WebhookBaseUrl: http://localhost:8080