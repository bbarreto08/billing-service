apiVersion: v1
kind: Secret
metadata:
  name: wrench-billing-config
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # "__" mapeia para seções aninhadas do appsettings (ConnectionStrings:Billing etc.)
  ConnectionStrings__Billing: {{ printf "Host=%s;Port=%v;Database=%s;Username=%s;Password=%s;SSL Mode=Require;Trust Server Certificate=true;" .Values.database.host (.Values.database.port | default 5432) .Values.database.name .Values.database.user .Values.database.password | quote }}
  Pagamento__WebhookSecret: {{ .Values.pagamento.webhookSecret | quote }}
  JwtOptions__Secret: {{ .Values.jwt.secret | quote }}
  JwtOptions__Issuer: {{ .Values.jwt.issuer | quote }}
  JwtOptions__Audience: {{ .Values.jwt.audience | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  # Nome próprio do serviço: o chart do os-service já cria "newrelic-credentials" neste namespace.
  name: wrench-billing-newrelic
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # Sem licenseKey o endpoint fica vazio e o serviço não exporta telemetria.
  {{- if .Values.newRelic.licenseKey }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.newRelic.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.newRelic.otlpProtocol | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ printf "api-key=%s" .Values.newRelic.licenseKey | quote }}
  {{- else }}
  OTEL_SDK_DISABLED: "true"
  {{- end }}
