apiVersion: v1
kind: Secret
metadata:
  name: wrench-billing-config
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # "__" mapeia para seções aninhadas do appsettings (ConnectionStrings:Billing etc.)
  ConnectionStrings__Billing: {{ printf "Host=%s;Port=%v;Database=%s;Username=%s;Password=%s;SSL Mode=Require;Trust Server Certificate=true;" .Values.database.host (.Values.database.port | default 5432) .Values.database.name .Values.database.user .Values.database.password | quote }}
  Pagamento__WebhookSecret: {{ .Values.pagamento.webhookSecret | quote }}
  JwtOptions__Secret: {{ .Values.jwt.secret | quote }}
  JwtOptions__Issuer: {{ .Values.jwt.issuer | quote }}
  JwtOptions__Audience: {{ .Values.jwt.audience | quote }}